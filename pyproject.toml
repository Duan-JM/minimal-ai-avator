[project]
name = "minimal-ai-avator"
version = "0.1.0"
description = "Minimal real-time interactive AI avatar service powered by Wav2Lip and WebRTC."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "aiortc>=1.9",
    "av>=12.0",
    "face-alignment>=1.4",
    "ffmpeg-python>=0.2",
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-sockets>=0.2",
    "imageio-ffmpeg>=0.4",
    "librosa>=0.10,<0.11",
    "loguru>=0.7",
    "lpips==0.1.3",
    "numba>=0.59,<0.62",
    "numpy>=1.23,<2",
    "openai>=1.0",
    "opencv-python-headless>=4.8,<4.12",
    "pyyaml>=6.0",
    "requests>=2.31",
    "resampy>=0.4",
    "scipy>=1.10",
    "six>=1.16",
    "socksio>=1.0",
    "soundfile==0.12.1",
    "torch==2.5.0",
    "torchaudio==2.5.0",
    "torchvision==0.20.0",
    "tqdm>=4.66",
    "transformers>=4.40",
    "websockets>=13.0",
]

[project.optional-dependencies]
azure = [
    "azure-cognitiveservices-speech>=1.40",
]
local-audio = [
    "pyaudio>=0.2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["backend"]
