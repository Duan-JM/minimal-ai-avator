[project]
name = "minimal-ai-avator"
version = "0.1.0"
description = "Minimal real-time interactive AI avatar service powered by Wav2Lip and WebRTC."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "aiohttp>=3.9",
    "aiohttp-cors>=0.7",
    "aiortc>=1.9",
    "av>=12.0",
    "face-alignment>=1.4",
    "ffmpeg-python>=0.2",
    "flask>=3.0",
    "imageio-ffmpeg>=0.4",
    "librosa>=0.10,<0.11",
    "loguru>=0.7",
    "lpips==0.1.3",
    "numba>=0.59,<0.62",
    "numpy>=1.23,<2",
    "openai>=1.0",
    "opencv-python-headless>=4.8,<4.12",
    "pyyaml>=6.0",
    "requests>=2.31",
    "resampy>=0.4",
    "scipy>=1.10",
    "six>=1.16",
    "socksio>=1.0",
    "soundfile==0.12.1",
    "torch>=2.6,<3.0",
    "torchaudio>=2.6,<3.0",
    "torchvision>=0.21,<1.0",
    "tqdm>=4.66",
    "websockets>=13.0",
]

[project.optional-dependencies]
azure = [
    "azure-cognitiveservices-speech>=1.40",
]
local-audio = [
    "pyaudio>=0.2.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["backend"]

[tool.bandit]
# Skip third-party vendored face-detection code (forked from upstream Wav2Lip).
# It carries benign Bandit findings (e.g. /var/tmp fallback, assert usage) that
# are not part of our codebase.
exclude_dirs = ["backend/src/wav2lip/face_detection"]
skips = [
    # Bandit B101 ``assert`` warnings only matter for code compiled with -O.
    # The vendored Wav2Lip audio/utility modules use plenty of asserts as
    # pre-conditions; we keep them as documentation rather than rewrite.
    "B101",
]
