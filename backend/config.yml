LLM:
  LLM_API_KEY: "your-llm-api-key"
  LLM_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  LLM_MODEL_NAME: "qwen-plus" # 可选: qwen-plus, qwen-max, qwen-turbo, gpt-4, gpt-3.5-turbo 等

TTS:
  DOUBAO_APPID: "your-doubao-appid"
  DOUBAO_TOKEN: "your-doubao-token"

  # 当 --tts vllm_omni 时使用：自部署的 vLLM-Omni TTS 服务（OpenAI 兼容 /v1/audio/speech）
  # VLLM_OMNI_URL: "http://localhost:8091"         # 服务地址；CLI --TTS_SERVER 优先级更高
  # VLLM_OMNI_API_KEY: ""                          # 可选，启用时会发送 Authorization: Bearer
  # VLLM_OMNI_MODEL: ""                            # 可选，留空由服务端 --omni 启动模型决定
  # VLLM_OMNI_VOICE: "vivian"                      # CLI --REF_FILE 或 avatar tts_config.voice 优先
  # VLLM_OMNI_LANGUAGE: "Auto"                     # Auto/Chinese/English/Japanese/Korean/...
  # VLLM_OMNI_TASK_TYPE: ""                        # CustomVoice / VoiceDesign / Base
  # VLLM_OMNI_INSTRUCTIONS: ""                     # 风格/情绪指令
  # VLLM_OMNI_SAMPLE_RATE: 24000                   # 服务端返回 PCM 的采样率，按模型选择

DOWNLOAD:
  BASE_URL: "https://huggingface.co/shibing624/ai-avatar-wav2lip/resolve/main"

  MODELS:
    wav2lip.pth:
      path: "./models/wav2lip.pth"
      size: "215 MB"
      description: "Wav2Lip256 唇形同步生成模型"

  AVATARS:
    wav2lip_avatar_female_model:
      url_suffix: "wav2lip_avatar_female_model.zip"
      path: "./data/wav2lip_avatar_female_model.zip"
      size: "353 MB"
      description: "女性数字人形象(含预处理人脸图片)"

    wav2lip_avatar_glass_man:
      url_suffix: "wav2lip_avatar_glass_man.zip"
      path: "./data/wav2lip_avatar_glass_man.zip"
      size: "88.4 MB"
      description: "戴眼镜男性数字人形象"

    wav2lip_avatar_long_hair_girl:
      url_suffix: "wav2lip_avatar_long_hair_girl.zip"
      path: "./data/wav2lip_avatar_long_hair_girl.zip"
      size: "153 MB"
      description: "长发女性数字人形象"

# 数字人配置
AVATARS:
  default_avatar: "ai_model"

  avatars:
    - id: "ai_model"
      name: "AI 模特"
      description: "专业的AI模特，展示时尚、优雅与自信"
      avatar_dir: "wav2lip_avatar_female_model"
      image: "/data/wav2lip_avatar_female_model/full_imgs/00000000.png"
      tts_config:
        type: "doubao"
        voice: "zh_female_sajiaonvyou_moon_bigtts"

    - id: "ai_girlfriend"
      name: "AI 女友"
      description: "温柔体贴的AI女友，倾听、关心、陪伴你的每一天"
      avatar_dir: "wav2lip_avatar_long_hair_girl"
      image: "/data/wav2lip_avatar_long_hair_girl/full_imgs/00000000.png"
      tts_config:
        type: "doubao"
        voice: "zh_female_tianmeixiaoyuan_moon_bigtts"

    - id: "ai_assistant"
      name: "AI 助手"
      description: "高效专业的AI助手，帮助你解决工作和学习中的各种问题"
      avatar_dir: "wav2lip_avatar_glass_man"
      image: "/data/wav2lip_avatar_glass_man/full_imgs/00000000.png"
      tts_config:
        type: "doubao"
        voice: "ICL_zh_male_hanhoudunshi_tob"
