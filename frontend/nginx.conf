server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（HTML 不缓存，便于发布）
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /talk.html { add_header Cache-Control "no-cache"; }
    location = /test.html { add_header Cache-Control "no-cache"; }
    location = /config.js { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
