version: "3.8"

# 前后端分离部署示例：
#   docker compose -f docker-compose.split.yml up --build
#
# - aiavatar-backend：仅提供 API（--no-static），保留 /data 静态资源给前端 <img>。
# - aiavatar-frontend：nginx 容器，托管 frontend/static，并在启动时把 BACKEND_API_URL
#   注入到 config.js，浏览器据此调用后端。
#
# 浏览器访问 http://localhost:8011/index.html。把 BACKEND_API_URL 替换为公开访问域名后，
# 同一份前端镜像可以服务于不同环境。
services:
  aiavatar-backend:
    build: .
    image: aiavatar:latest
    container_name: aiavatar-backend
    restart: unless-stopped
    command: ["--port", "8010", "--no-static"]
    ports:
      - "8010:8010"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./backend/config.yml:/app/backend/config.yml:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  aiavatar-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: aiavatar-frontend:latest
    container_name: aiavatar-frontend
    restart: unless-stopped
    depends_on:
      - aiavatar-backend
    environment:
      # 浏览器需能访问到这里填的 URL；本地开发用 host 端口即可。
      - BACKEND_API_URL=http://localhost:8010
      - BACKEND_MEDIA_URL=http://localhost:8010
      - FRONTEND_ICE_SERVERS_JSON=[]
    ports:
      - "8011:80"
